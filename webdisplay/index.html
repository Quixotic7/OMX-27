<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OMX-27 Display</title>
<style>
  :root {
    --bg: #0a0b0f;
    --panel: #14161d;
    --panel-2: #1c1f28;
    --line: #2a2e3a;
    --text: #e7ebf3;
    --muted: #8b93a7;
    --accent: #22d3ee;
    --ok: #34d399;
    --bad: #f87171;
    --screen: #d8f6ff; /* pixel colour, overridden by theme */
    --glow: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #12151d 0%, var(--bg) 60%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 48px;
    min-height: 100%;
  }
  header { text-align: center; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 650; letter-spacing: .2px; margin: 0; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .device {
    background: linear-gradient(180deg, #0d0f14, #05060a);
    border: 1px solid #23262f;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
    max-width: 100%;
  }
  .screen-wrap {
    background: #000;
    border-radius: 10px;
    padding: 14px;
    box-shadow: inset 0 0 0 1px #1b1e26, inset 0 0 40px rgba(0,0,0,.9);
    line-height: 0;
  }
  canvas#screen {
    display: block;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 var(--glow) var(--screen));
    max-width: 100%;
    height: auto;
  }

  .bar {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    margin-top: 16px; font-size: 13px; color: var(--muted);
    max-width: 820px; justify-content: center;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; margin-right: 7px; box-shadow: 0 0 8px currentColor; color: var(--bad); }
  .dot.on { background: var(--ok); color: var(--ok); }
  .stat b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center;
    margin-top: 22px; max-width: 820px;
  }
  button {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .05s;
  }
  button:hover { border-color: #3a4152; background: #22262f; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #062c33; border-color: transparent; }
  button.primary:hover { filter: brightness(1.06); }
  button.ghost { background: transparent; }

  .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  .field label { padding-left: 2px; }
  .field .row { display: flex; align-items: center; gap: 8px; }
  select, input[type=range] { accent-color: var(--accent); }
  select {
    appearance: none; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px;
  }
  input[type=range] { width: 130px; }
  .val { color: var(--text); font-variant-numeric: tabular-nums; min-width: 34px; }
  .swatches { display: flex; gap: 6px; }
  .swatch { width: 22px; height: 22px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  .swatch.sel { border-color: #fff; }

  .note {
    margin-top: 26px; max-width: 640px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.55;
  }
  .note code { background: #000; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: #cbd5e1; }
  .err { color: var(--bad); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>OMX&#8209;27 <span>Display</span></h1>
    <div class="sub">live screen mirror over USB&#8209;MIDI &middot; Web MIDI</div>
  </header>

  <div class="device">
    <div class="screen-wrap"><canvas id="screen" width="768" height="192"></canvas></div>
  </div>

  <div class="bar">
    <span class="stat"><span id="dot" class="dot"></span><span id="conn">disconnected</span></span>
    <span class="stat">device <b id="devname">&mdash;</b></span>
    <span class="stat"><b id="fps">0</b> fps</span>
    <span class="stat"><b id="frames">0</b> frames</span>
    <span class="stat"><b id="drops">0</b> resend</span>
  </div>

  <div class="controls">
    <button id="connect" class="primary">Connect</button>
    <button id="popout" class="ghost">Pop out &#8599;</button>
    <button id="demo" class="ghost">Test pattern</button>

    <div class="field">
      <label>colour</label>
      <div class="row swatches" id="swatches"></div>
    </div>
    <div class="field">
      <label>size</label>
      <div class="row"><input id="scale" type="range" min="3" max="12" step="1" value="6"><span class="val" id="scaleVal">6&times;</span></div>
    </div>
    <div class="field">
      <label>glow</label>
      <div class="row"><input id="glow" type="range" min="0" max="24" step="1" value="8"><span class="val" id="glowVal">8</span></div>
    </div>
    <div class="field">
      <label>grid</label>
      <div class="row"><input id="grid" type="checkbox" checked></div>
    </div>
    <div class="field">
      <label>VHS</label>
      <div class="row"><input id="vhs" type="checkbox"></div>
    </div>
    <div class="field">
      <label>CRT</label>
      <div class="row"><input id="crt" type="checkbox"></div>
    </div>
    <div class="field">
      <label>OMX pace ms</label>
      <div class="row"><input id="pace" type="range" min="1" max="30" step="1" value="4"><span class="val" id="paceVal">4</span></div>
    </div>
  </div>

  <div class="note" id="note">
    Requires Chrome/Edge over <code>https</code> or <code>localhost</code> (Web MIDI + SysEx).
    Connect the OMX&#8209;27 (RP2040, with the display&#8209;mirror firmware) by USB, then press <b>Connect</b>
    and allow MIDI access.
  </div>

<script>
"use strict";
(() => {
  // ---- protocol (matches src/midi/norns_link.h) -------------------------
  const MANU = [0x7d, 0x00, 0x00];
  const CMD_FRAME = 0x50, CMD_STATUS = 0x52, CMD_FRAME_END = 0x53;
  const CMD_MIRROR_EN = 0x58, CMD_REQ = 0x5e, CMD_PACE = 0x5f;
  const OMX_W = 128, OMX_H = 32, FB_BYTES = 512;
  const CHUNK_BYTES = 32, CHUNK_COUNT = 16;

  // ---- state ------------------------------------------------------------
  const fb = new Uint8Array(FB_BYTES);        // SSD1306 page layout
  const chunkFid = new Int16Array(CHUNK_COUNT).fill(-1);
  let midi = null, omxIn = null, omxOut = null;
  let connected = false, demo = false, dirty = true;
  let frames = 0, drops = 0, fps = 0, recvCount = 0;
  let heartbeat = null;

  // ---- decode (mirror of omx_sysex.lua decode7bit) ----------------------
  function decode7bit(src, from, to) {
    const out = [];
    let i = from;
    while (i <= to) {
      const hi = src[i]; i++;
      const n = Math.min(7, to - i + 1);
      for (let j = 0; j < n; j++) {
        let b = src[i + j] & 0x7f;
        if ((hi >> j) & 1) b |= 0x80;
        out.push(b);
      }
      i += n;
    }
    return out;
  }

  // ---- incoming sysex ---------------------------------------------------
  function onMIDIMessage(e) {
    const d = e.data;
    if (d.length < 5 || d[0] !== 0xf0) return;
    if (d[1] !== MANU[0] || d[2] !== MANU[1] || d[3] !== MANU[2]) return;
    const cmd = d[4];
    if (cmd === CMD_FRAME) handleChunk(d);
    else if (cmd === CMD_FRAME_END) handleEnd(d);
    // CMD_STATUS (input activity) is not needed for a passive display
  }

  function handleChunk(d) {
    const chunk = d[5], fid = d[6], cksum = d[7];
    if (chunk >= CHUNK_COUNT) return;
    const dec = decode7bit(d, 8, d.length - 2);
    if (dec.length !== CHUNK_BYTES) return;      // corrupt / wrong length
    let sum = 0; for (let i = 0; i < CHUNK_BYTES; i++) sum += dec[i];
    if ((sum & 0x7f) !== cksum) return;          // checksum mismatch
    const base = chunk * CHUNK_BYTES;
    for (let i = 0; i < CHUNK_BYTES; i++) fb[base + i] = dec[i];
    chunkFid[chunk] = fid;
    dirty = true;
  }

  function handleEnd(d) {
    const fid = d[5];
    const mask = (d[6] & 0x7f) | ((d[7] & 0x7f) << 7) | ((d[8] & 0x03) << 14);
    // any chunks this frame listed but we didn't receive with this fid? ask again.
    let miss = 0;
    for (let c = 0; c < CHUNK_COUNT; c++) {
      if ((mask & (1 << c)) && chunkFid[c] !== fid) miss |= (1 << c);
    }
    if (miss && omxOut) {
      drops++;
      sendSysex(CMD_REQ, [miss & 0x7f, (miss >> 7) & 0x7f, (miss >> 14) & 0x03]);
    }
    frames++; recvCount++;
    dirty = true;
  }

  // ---- outgoing ---------------------------------------------------------
  function sendSysex(cmd, payload) {
    if (!omxOut) return;
    const msg = [0xf0, ...MANU, cmd, ...(payload || []).map(b => b & 0x7f), 0xf7];
    try { omxOut.send(msg); } catch (_) {}
  }
  function setEnabled(on) {
    if (on) sendSysex(CMD_PACE, [ui.pace]);
    sendSysex(CMD_MIRROR_EN, [on ? 1 : 0]);
  }

  // ---- Web MIDI ---------------------------------------------------------
  function findOMX() {
    omxIn = null; omxOut = null;
    for (const p of midi.inputs.values())
      if ((p.name || "").toLowerCase().includes("omx")) omxIn = p;
    for (const p of midi.outputs.values())
      if ((p.name || "").toLowerCase().includes("omx")) omxOut = p;
    return omxIn && omxOut;
  }

  function bindInput() {
    if (omxIn) omxIn.onmidimessage = onMIDIMessage;
  }

  function refreshConnection() {
    const was = connected;
    connected = midi ? findOMX() : false;
    if (connected) bindInput();
    if (connected && !was) {
      setEnabled(true);
      if (heartbeat) clearInterval(heartbeat);
      heartbeat = setInterval(() => setEnabled(true), 2000); // survive OMX reboot
    }
    if (!connected && was && heartbeat) { clearInterval(heartbeat); heartbeat = null; }
    updateStatus();
  }

  async function connect() {
    if (!navigator.requestMIDIAccess) {
      note('<span class="err">Web MIDI is not available in this browser.</span> Use Chrome or Edge.');
      return;
    }
    try {
      midi = await navigator.requestMIDIAccess({ sysex: true });
    } catch (err) {
      note('<span class="err">MIDI access denied.</span> It needs https/localhost and SysEx permission. ' + (err && err.message ? err.message : ''));
      return;
    }
    midi.onstatechange = refreshConnection;
    demo = false;
    refreshConnection();
    if (!connected) note('Connected to Web MIDI, but no device named "omx" was found. Plug in the OMX-27 and it will appear automatically.');
    else note('');
  }

  // ---- rendering --------------------------------------------------------
  const cv = document.getElementById('screen');
  const ctx = cv.getContext('2d');
  // pixels are drawn to this offscreen buffer, then composited (bloom + sharp)
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d');
  const ui = { scale: 6, glow: 8, grid: true, vhs: false, crt: false, color: '#d8f6ff', bg: '#000000', pace: 4 };

  function pixelOn(x, y) { return (fb[x + (y >> 3) * OMX_W] >> (y & 7)) & 1; }

  function resize() {
    cv.width = OMX_W * ui.scale;
    cv.height = OMX_H * ui.scale;
    document.documentElement.style.setProperty('--screen', ui.color);
    cv.style.filter = 'none'; // glow is now composited in-canvas
    dirty = true;
  }

  // ---- VHS tracking state (advanced once per frame in loop) --------------
  // A small weather system of tape faults, each with its own rarity and a
  // fade-in/out envelope, all in whole OMX pixels (chunky):
  //   tear1   - the creeping tracking band loses lock, rows +-3 tear (0.2-1.5s)
  //   tear2   - two tear bands at once                            (3-15s)
  //   tear4   - four tear bands at once                           (20-60s)
  //   corrupt - 1-4 rows of noise that fades in and out           (8-30s)
  //   wobble  - brief whole-image wobble                          (30-200s)
  // Between events the picture is rock-steady.
  const rowOff = new Int8Array(OMX_H);      // per-row shift in whole OMX pixels
  const noiseRows = new Float32Array(OMX_H); // per-row noise intensity 0..1
  let vhsT = 0, scanY = -4;
  let vhsBands = [];                         // visible bands for the overlay {y, env}
  const R = (a, b) => a + Math.random() * (b - a);
  const RI = (a, b) => Math.round(R(a, b));
  // intervals in seconds (~60fps), durations in frames
  function mkFx(minI, maxI, minD, maxD) {
    return { minI, maxI, minD, maxD, active: false, start: 0, until: 0, next: -1, data: null };
  }
  const fx = {
    tear1: mkFx(0.2, 1.5, 12, 42),
    tear2: mkFx(3, 15, 20, 55),
    tear4: mkFx(20, 60, 30, 80),
    corrupt: mkFx(8, 120, 25, 70),
    wobble: mkFx(30, 400, 25, 60),
  };
  function env01(f) {
    const t = (vhsT - f.start) / Math.max(1, f.until - f.start);
    return Math.sin(Math.PI * Math.min(1, Math.max(0, t)));
  }
  function mkBand(y) { return { y, hold: 0, shifts: new Int8Array(7) }; }
  function stepBand(b) {
    if (b.hold <= 0) {                       // new tear pattern, held a few frames
      for (let i = 0; i < 7; i++) {
        const d = Math.abs(i - 3);
        const maxS = d === 0 ? 4 : d === 1 ? 3 : d === 2 ? 2 : 1; // strongest at the band
        b.shifts[i] = Math.random() < 0.6 ? Math.round((Math.random() * 2 - 1) * maxS) : 0;
      }
      b.hold = 2 + (Math.random() * 4 | 0);
    }
    b.hold--;
    b.y += 0.05;                             // slight downward drift while torn
    const c = Math.round(b.y);
    for (let i = 0; i < 7; i++) {
      const ry = c - 3 + i;
      if (ry >= 0 && ry < OMX_H) rowOff[ry] += b.shifts[i];
    }
  }
  function stepVHS() {
    vhsT++;
    scanY += 0.035;                          // creeping tracking line, ~15s per sweep
    if (scanY > OMX_H + 4) scanY = -4;
    rowOff.fill(0);
    noiseRows.fill(0);
    vhsBands = [];
    for (const name in fx) {
      const f = fx[name];
      if (f.next < 0) f.next = vhsT + R(f.minI, f.maxI) * 60; // schedule first occurrence
      if (!f.active && vhsT >= f.next) {
        f.active = true; f.start = vhsT; f.until = vhsT + RI(f.minD, f.maxD);
        if (name === 'tear1') f.data = [mkBand(scanY)];
        else if (name === 'tear2') f.data = [0, 1].map(i => mkBand(R(2, OMX_H / 2 - 4) + i * (OMX_H / 2)));
        else if (name === 'tear4') f.data = [0, 1, 2, 3].map(i => mkBand(R(0, OMX_H / 4 - 2) + i * (OMX_H / 4)));
        else if (name === 'corrupt') f.data = { row: RI(0, OMX_H - 4), span: RI(1, 4) };
        else if (name === 'wobble') f.data = { amp: R(1.5, 3), freq: R(0.15, 0.35), phase: R(0, 6.28) };
      }
      if (!f.active) continue;
      if (vhsT > f.until) { f.active = false; f.next = vhsT + R(f.minI, f.maxI) * 60; continue; }
      const e = env01(f);
      if (name === 'tear1') {
        f.data[0].y = scanY;                 // this band rides the creeping line
        stepBand(f.data[0]);
        vhsBands.push({ y: scanY, env: e });
      } else if (name === 'tear2' || name === 'tear4') {
        for (const b of f.data) { stepBand(b); vhsBands.push({ y: b.y, env: e }); }
      } else if (name === 'corrupt') {
        for (let i = 0; i < f.data.span; i++) {
          const ry = f.data.row + i;
          if (ry < OMX_H) noiseRows[ry] = e;
        }
      } else if (name === 'wobble') {
        const o = Math.round(Math.sin((vhsT - f.start) * f.data.freq + f.data.phase) * f.data.amp * e);
        if (o) for (let ry = 0; ry < OMX_H; ry++) rowOff[ry] += o;
      }
    }
    for (let ry = 0; ry < OMX_H; ry++) {     // keep stacked shifts sane
      if (rowOff[ry] > 6) rowOff[ry] = 6; else if (rowOff[ry] < -6) rowOff[ry] = -6;
    }
  }

  // Draw just the lit pixels (transparent bg) into g, with optional VHS warp.
  // Grid on -> inset dot-matrix (rounded at large sizes). Grid off -> pixels tile
  // edge-to-edge from rounded cell boundaries, so solid areas are truly solid.
  function drawPixels(g, W, H) {
    const s = Math.min(W / OMX_W, H / OMX_H);
    const ox = (W - OMX_W * s) / 2, oy = (H - OMX_H * s) / 2;
    const gap = ui.grid ? Math.max(1, Math.round(s * 0.14)) : 0;
    const g0 = gap >> 1, g1 = gap - g0;
    const rounded = ui.grid && s >= 6;
    g.clearRect(0, 0, W, H);
    g.fillStyle = ui.color;
    for (let dy = 0; dy < OMX_H; dy++) {
      const sy = OMX_H - 1 - dy;                 // 180deg rotation (matches firmware)
      const xoff = ui.vhs ? rowOff[dy] * s : 0;
      const y0 = Math.round(oy + dy * s) + g0, y1 = Math.round(oy + (dy + 1) * s) - g1;
      const nz = ui.vhs ? noiseRows[dy] : 0;   // corruption: randomize cells, faded by envelope
      for (let dx = 0; dx < OMX_W; dx++) {
        let on = pixelOn(OMX_W - 1 - dx, sy);
        if (nz > 0 && Math.random() < nz * 0.8) on = Math.random() < 0.5;
        if (on) {
          const x0 = Math.round(ox + dx * s + xoff) + g0, x1 = Math.round(ox + (dx + 1) * s + xoff) - g1;
          const w = x1 - x0, h = y1 - y0;
          if (w <= 0 || h <= 0) continue;
          if (rounded) { g.beginPath(); g.roundRect(x0, y0, w, h, Math.min(3, w * 0.3)); g.fill(); }
          else g.fillRect(x0, y0, w, h);
        }
      }
    }
    return { s, ox, oy };
  }

  // Base scene into g (fit WxH): background, per-pixel bloom, sharp pixels, VHS.
  function renderScene(g, W, H) {
    g.fillStyle = ui.bg;
    g.fillRect(0, 0, W, H);
    if (off.width !== W || off.height !== H) { off.width = W; off.height = H; }
    const geo = drawPixels(offCtx, W, H);
    if (ui.glow > 0) {                          // bloom halo
      g.save();
      g.filter = `blur(${ui.glow}px)`;
      g.globalAlpha = 0.85;
      g.drawImage(off, 0, 0);
      g.restore();
    }
    g.drawImage(off, 0, 0);                      // sharp pixels
    if (ui.vhs) drawVHSOverlay(g, W, H, geo);
    return geo;
  }

  function drawFrame(ctx, W, H) {
    if (!ui.crt) { renderScene(ctx, W, H); return; }
    drawCRT(ctx, W, H);
  }

  // ---- CRT monitor simulation -------------------------------------------
  // Renders the scene, splits it into R/G/B channels drawn at slightly different
  // scales (chromatic aberration that grows toward the edges), curves the result
  // (barrel distortion), then layers an RGB phosphor shadow mask, interlaced
  // scanlines, vignette, noise/grain, flicker and a glass highlight.
  const scene = document.createElement('canvas'), sceneCtx = scene.getContext('2d');
  const abPass = document.createElement('canvas'), abCtx = abPass.getContext('2d');
  const chan = ['#ff0000', '#00ff00', '#0000ff'].map(c => {
    const k = document.createElement('canvas');
    return { c, k, g: k.getContext('2d') };
  });
  const noise = document.createElement('canvas'); noise.width = noise.height = 128;
  const noiseCtx = noise.getContext('2d');
  const maskCache = new WeakMap();
  let crtFrame = 0;

  function makeNoise() {
    const id = noiseCtx.createImageData(128, 128), d = id.data;
    for (let i = 0; i < d.length; i += 4) { const v = (Math.random() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    noiseCtx.putImageData(id, 0, 0);
  }
  makeNoise();

  function shadowMask(ctx) {
    let p = maskCache.get(ctx);
    if (p) return p;
    const m = document.createElement('canvas'); m.width = 3; m.height = 1;
    const g = m.getContext('2d');
    g.fillStyle = '#ff3030'; g.fillRect(0, 0, 1, 1);
    g.fillStyle = '#30ff30'; g.fillRect(1, 0, 1, 1);
    g.fillStyle = '#3030ff'; g.fillRect(2, 0, 1, 1);
    p = ctx.createPattern(m, 'repeat');
    maskCache.set(ctx, p);
    return p;
  }

  function fit(c, W, H) { if (c.width !== W || c.height !== H) { c.width = W; c.height = H; } }

  function drawCRT(ctx, W, H) {
    crtFrame++;
    if ((crtFrame & 1) === 0) makeNoise();
    const s = Math.min(W / OMX_W, H / OMX_H);

    // 1) base scene
    fit(scene, W, H);
    renderScene(sceneCtx, W, H);

    // 2) chromatic aberration: isolate channels, recombine with edge-growing offsets
    const ab = Math.max(1.2, s * 0.32);          // px of split at the screen edge
    fit(abPass, W, H);
    abCtx.globalCompositeOperation = 'source-over';
    abCtx.fillStyle = '#000'; abCtx.fillRect(0, 0, W, H);
    const scales = [1 + (2 * ab) / W, 1, 1 - (2 * ab) / W];
    chan.forEach((ch, i) => {
      fit(ch.k, W, H);
      ch.g.globalCompositeOperation = 'source-over';
      ch.g.drawImage(scene, 0, 0);
      ch.g.globalCompositeOperation = 'multiply';
      ch.g.fillStyle = ch.c; ch.g.fillRect(0, 0, W, H);   // keep one channel
      const sc = scales[i], dw = W * sc, dh = H * sc;
      abCtx.globalCompositeOperation = 'lighter';
      abCtx.drawImage(ch.k, (W - dw) / 2, (H - dh) / 2, dw, dh);
    });
    abCtx.globalCompositeOperation = 'source-over';

    // 3) barrel distortion: vertical strips, height shrinking toward the sides
    ctx.save();
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const r = Math.max(6, s * 1.6);
    ctx.beginPath(); ctx.roundRect(0, 0, W, H, r); ctx.clip();
    const flicker = 0.955 + Math.random() * 0.045;  // subtle brightness flutter
    ctx.globalAlpha = flicker;
    const N = Math.min(128, Math.max(32, (W / 6) | 0)), curve = 0.085;
    const sw = W / N;
    for (let i = 0; i < N; i++) {
      const sx = i * sw;
      const u = ((sx + sw / 2) / W - 0.5) * 2;
      const sc = 1 - curve * u * u;
      const dh = H * sc, dy = (H - dh) / 2;
      ctx.drawImage(abPass, sx, 0, sw + 1, H, sx, dy, sw + 1, dh);
    }
    ctx.globalAlpha = 1;

    // 4) phosphor shadow mask (RGB triads)
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = shadowMask(ctx);
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // 5) interlaced scanlines (phase alternates each frame)
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    const step = Math.max(2, Math.round(s * 0.5)), ph = (crtFrame & 1) ? (step >> 1) : 0;
    for (let y = ph; y < H; y += step) ctx.fillRect(0, y, W, Math.max(1, step >> 1));

    // 6) vignette + corner darkening
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    // 7) grain
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.09;
    ctx.drawImage(noise, 0, 0, W, H);
    ctx.restore();

    // 8) glass highlight (soft reflection across the top)
    const gl = ctx.createLinearGradient(0, 0, W * 0.3, H);
    gl.addColorStop(0, 'rgba(255,255,255,0.07)');
    gl.addColorStop(0.45, 'rgba(255,255,255,0.015)');
    gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawVHSOverlay(ctx, W, H, geo) {
    const s = geo.s, oy = geo.oy;
    // faint static scanlines (ambient texture)
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    const step = Math.max(2, Math.round(s * 0.5));
    for (let y = 0; y < H; y += step) ctx.fillRect(0, y, W, Math.max(1, step >> 1));
    // tear bands are only visible during a tracking-loss event
    if (vhsBands.length === 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const b of vhsBands) {
      const env = b.env;
      if (env <= 0) continue;
      const cy = oy + b.y * s + s / 2, bh = Math.max(6, s * 3.5);
      const grad = ctx.createLinearGradient(0, cy - bh, 0, cy + bh);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(0.5, `rgba(255,255,255,${0.13 * env})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, cy - bh, W, bh * 2);
      ctx.fillStyle = `rgba(255,255,255,${0.08 * env})`; // thin noisy head-switch line
      ctx.fillRect(0, cy + (Math.random() * 2 - 1), W, 1);
    }
    ctx.restore();
  }

  // ---- pop-out window ---------------------------------------------------
  // Prefers Document Picture-in-Picture: a chromeless, always-on-top, resizable
  // window with NO address bar. Falls back to a plain popup on older browsers.
  let popupWin = null, popupCv = null, popupCtx = null, popupPlain = false;
  function closePopup() { popupWin = null; popupCv = null; popupCtx = null; }
  function attachPopup(win, plain) {
    popupWin = win; popupPlain = plain;
    const doc = win.document, b = doc.body;
    doc.documentElement.style.height = '100%';
    b.style.cssText = 'margin:0;height:100%;background:#000;overflow:hidden';
    popupCv = doc.createElement('canvas');
    popupCv.style.display = 'block';
    b.appendChild(popupCv);
    popupCtx = popupCv.getContext('2d');
    const fit = () => { popupCv.width = win.innerWidth; popupCv.height = win.innerHeight; dirty = true; };
    win.addEventListener('resize', fit);
    win.addEventListener('pagehide', closePopup);
    fit();
  }
  async function openPopup() {
    if (popupWin && !(popupPlain && popupWin.closed)) { try { popupWin.focus(); } catch (_) {} return; }
    if ('documentPictureInPicture' in window) {
      try {
        const w = await documentPictureInPicture.requestWindow({ width: 820, height: 230 });
        attachPopup(w, false);
        return;
      } catch (_) { /* fall through to a plain popup */ }
    }
    const w = window.open('', 'omx-display', 'width=820,height=230');
    if (!w) { note('<span class="err">Pop-out blocked.</span> Allow pop-ups for this page, then try again.'); return; }
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>OMX-27 Display</title></head><body></body></html>');
    w.document.close();
    attachPopup(w, true);
  }

  function loop() {
    if (ui.vhs) stepVHS();
    if (dirty || ui.vhs || ui.crt) {
      drawFrame(ctx, cv.width, cv.height);
      if (popupWin) {
        if (popupPlain && popupWin.closed) closePopup();
        else if (popupCtx) drawFrame(popupCtx, popupCv.width, popupCv.height);
      }
      dirty = false;
    }
    requestAnimationFrame(loop);
  }
  setInterval(() => { fps = recvCount * 2; recvCount = 0; updateStatus(); }, 500);

  // ---- demo / test pattern ---------------------------------------------
  function setPixel(x, y, on) {
    if (x < 0 || x >= OMX_W || y < 0 || y >= OMX_H) return;
    const i = x + (y >> 3) * OMX_W, m = 1 << (y & 7);
    if (on) fb[i] |= m; else fb[i] &= ~m;
  }
  let demoPhase = 0, demoTimer = null;
  function demoFrame() {
    fb.fill(0);
    // border
    for (let x = 0; x < OMX_W; x++) { setPixel(x, 0, 1); setPixel(x, OMX_H - 1, 1); }
    for (let y = 0; y < OMX_H; y++) { setPixel(0, y, 1); setPixel(OMX_W - 1, y, 1); }
    // bouncing sine
    for (let x = 2; x < OMX_W - 2; x++) {
      const y = Math.round(OMX_H / 2 + (OMX_H / 2 - 4) * Math.sin((x + demoPhase) * 0.14));
      setPixel(x, y, 1); setPixel(x, y + 1, 1);
    }
    // moving block
    const bx = 2 + ((demoPhase * 2) % (OMX_W - 12));
    for (let y = 2; y < 8; y++) for (let x = bx; x < bx + 8; x++) setPixel(x, y, 1);
    demoPhase++;
    frames++; recvCount++; dirty = true;
  }
  function toggleDemo() {
    demo = !demo;
    if (demo) {
      if (heartbeat) { clearInterval(heartbeat); heartbeat = null; }
      connected = false; updateStatus();
      demoTimer = setInterval(demoFrame, 33);
      note('Test pattern (no hardware). Press <b>Connect</b> for the real OMX-27.');
    } else {
      clearInterval(demoTimer); demoTimer = null; fb.fill(0); dirty = true;
      note('');
    }
    document.getElementById('demo').textContent = demo ? 'Stop test' : 'Test pattern';
  }

  // ---- UI wiring --------------------------------------------------------
  const $ = id => document.getElementById(id);
  function updateStatus() {
    $('dot').classList.toggle('on', connected || demo);
    $('conn').textContent = demo ? 'test pattern' : (connected ? 'connected' : 'disconnected');
    $('devname').textContent = connected && omxIn ? (omxIn.name || 'OMX-27') : '—';
    $('fps').textContent = fps;
    $('frames').textContent = frames;
    $('drops').textContent = drops;
  }
  function note(html) { $('note').innerHTML = html || defaultNote; }
  const defaultNote = $('note').innerHTML;

  // [foreground, background, label]. Retro palettes tint the background too.
  const COLORS = [
    ['#d8f6ff', '#000000', 'white'], ['#22d3ee', '#000000', 'cyan'], ['#7dd3fc', '#000000', 'blue'],
    ['#fbbf24', '#000000', 'amber'], ['#34d399', '#000000', 'green'],
    ['#9a8cf0', '#3b2f91', 'C64'], ['#e6444f', '#0a0a0a', 'NES'], ['#e8a020', '#0b0900', 'Atari']
  ];
  const sw = $('swatches');
  COLORS.forEach(([fg, bg, label], i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i === 0 ? ' sel' : '');
    el.style.background = bg === '#000000' ? fg : `linear-gradient(135deg, ${fg} 50%, ${bg} 50%)`;
    el.title = label;
    el.onclick = () => {
      ui.color = fg; ui.bg = bg; resize();
      [...sw.children].forEach(x => x.classList.remove('sel')); el.classList.add('sel');
    };
    sw.appendChild(el);
  });

  $('connect').onclick = connect;
  $('popout').onclick = openPopup;
  $('demo').onclick = toggleDemo;
  $('scale').oninput = e => { ui.scale = +e.target.value; $('scaleVal').innerHTML = ui.scale + '&times;'; resize(); };
  $('glow').oninput = e => { ui.glow = +e.target.value; $('glowVal').textContent = ui.glow; resize(); };
  $('grid').onchange = e => { ui.grid = e.target.checked; dirty = true; };
  $('vhs').onchange = e => { ui.vhs = e.target.checked; dirty = true; };
  $('crt').onchange = e => { ui.crt = e.target.checked; dirty = true; };
  $('pace').oninput = e => { ui.pace = +e.target.value; $('paceVal').textContent = ui.pace; if (connected) sendSysex(CMD_PACE, [ui.pace]); };

  window.addEventListener('beforeunload', () => {
    if (connected) setEnabled(false);
    if (popupWin && popupPlain && !popupWin.closed) popupWin.close();
  });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
